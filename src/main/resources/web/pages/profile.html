<section id="profile" class="page" data-page="profile">
    <div class="card public-profile__card">
        <div class="profile-card__hero">
            <div class="profile-avatar-large">
                <img src="assets/Pura.png" alt="Avatar" id="profile-avatar-large">
            </div>
            <div>
                <div class="profile-titleline"><span class="profile-online">● Профиль игрока</span></div>
                <h1 id="profile-nickname-detail">Загрузка…</h1>
                <div class="profile-badges">
                    <span class="profile-badge" id="profile-role-detail">Игрок</span>
                    <span class="profile-badge profile-badge--level">LVL <strong id="profile-level-detail">1</strong></span>
                </div>
            </div>
        </div>
        <dl class="dashboard-data">
            <div><dt>Nickname</dt><dd id="profile-nickname-row">—</dd></div>
            <div><dt>Статус</dt><dd id="profile-status-row">Оффлайн</dd></div>
            <div><dt>Уровень</dt><dd>LVL <span id="profile-level-row">1</span></dd></div>
            <div><dt>Активность</dt><dd id="profile-activity-row">0 ч.</dd></div>
        </dl>
        <div class="public-profile__actions">
            <button type="button" class="btn" data-action="logout" style="color: var(--danger-color);">Выйти</button>
        </div>
    </div>
</section>
